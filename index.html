<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panko Pato Rewards</title>
    
<meta property="og:title" content="Panko Pato - Tarjeta de Lealtad 🌭🦆">
<meta property="og:description" content="¡Acumula sellos en cada compra y desbloquea premios deliciosos! ✨">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pankopato.github.io/mis-recompensas/">
<meta property="og:image" content="https://pankopato.github.io/mis-recompensas/logo.svg">
<meta property="og:image:type" content="image/svg+xml">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Panko Pato - Tarjeta de Lealtad 🌭">
<meta name="twitter:description" content="¡Acumula sellos en cada compra y desbloquea premios deliciosos! ✨">
<meta name="twitter:image" content="https://pankopato.github.io/mis-recompensas/logo.svg">
    
<style>
:root{
    --bg-color:#43b1c9;
    --bun-color:#e3f6f9;
    --sausage-color:#61cbd9;
    --sauce-color:#f7e018;
    --white:#ffffff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--bg-color);
    font-family:Arial, sans-serif;
    color:white;
    padding:20px;
}

.card{
    width:100%;
    max-width:380px;
    background:rgba(255,255,255,0.15);
    border:4px solid white;
    border-radius:30px;
    padding:30px 20px;
    backdrop-filter:blur(10px);
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.logo{
    margin-bottom:15px;
}

.welcome{
    opacity:.8;
    margin-bottom:5px;
}

.client-name{
    font-size:2rem;
    font-weight:bold;
    text-transform:uppercase;
    margin-bottom:20px;
}
    
.card-subtitle {
    font-size: 1rem;
    font-weight: normal;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.75;
    margin-top: -10px; /* Hace que se pegue de forma estética al nombre */
    margin-bottom: 25px;
}
    
.hotdog-container{
    position:relative;
    width:100%;
    height:100px;
    margin:30px 0;
}

.bun{
    position:absolute;
    width:100%;
    height:80px;
    top:10px;
    background:var(--bun-color);
    border:4px solid white;
    border-radius:40px;
}

.sausage{
    position:absolute;
    width:106%;
    left:-3%;
    top:30px;
    height:40px;
    background:var(--sausage-color);
    border:4px solid white;
    border-radius:30px;
    z-index:2;
}

.sauce{
    position:absolute;
    top:30px;
    left:0;
    width:0%;
    height:40px;
    overflow:hidden;
    z-index:3;
    transition:width 1s ease;
}

.sauce-svg{
    width:340px;
    height:40px;
    fill:none;
    stroke:var(--sauce-color);
    stroke-width:10;
    stroke-linecap:round;
}

.steps-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:25px;
}

.step{
    background:rgba(255,255,255,0.2);
    border:2px solid white;
    border-radius:15px;
    padding:15px 0;
    font-weight:bold;
    transition:.3s;
    font-size: 1.1rem;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 55px;
}

.step.active{
    background:var(--sauce-color);
    color:#333;
    transform:scale(1.05);
    border-color:var(--sauce-color);
}

.footer-msg{
    margin-top:25px;
    font-size:.95rem;
    opacity:.9;
    line-height: 1.4;
}

.instagram-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 25px;
    color: white;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: bold;
    opacity: 0.85;
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.instagram-link:hover {
    opacity: 1;
    transform: scale(1.05);
}

.instagram-link svg {
    margin-right: 8px;
    fill: white;
}

.legal-text {
    margin-top: 20px;
    font-size: 0.72rem;
    opacity: 0.6;
    letter-spacing: 0.5px;
    line-height: 1.3;
    border-top: 1px solid rgba(255,255,255,0.2);
    padding-top: 15px;
}

.error{
    text-align:center;
    font-size:1.2rem;
    padding:20px;
}

@keyframes premioActivo {
    0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(247,224,24,0.4)); }
    50% { transform: scale(1.12); filter: drop-shadow(0 0 8px rgba(247,224,24,0.7)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(247,224,24,0.4)); }
}

.step.active.is-premio {
    animation: premioActivo 2s infinite ease-in-out;
    background: #ffffff !important;
    border-color: #ffffff !important;
    color: #333 !important;
    font-size: 1.1rem;
}
</style>
</head>

<body>

<div class="card" id="card" style="display:none;">

    <div class="logo">
        <img src="logo.svg" alt="Panko Logo" style="width: 100%; max-width: 180px; height: auto; display: block; margin: 0 auto 10px;">
    </div>

    <div class="welcome">¡Hola!</div>

    <div class="client-name" id="userName">Cliente</div>
    <div class="card-subtitle">Panko Pato Club</div>

    <div class="hotdog-container">
        <div class="bun"></div>
        <div class="sausage"></div>
        <div class="sauce" id="sauceLayer">
            <svg class="sauce-svg" viewBox="0 0 340 40">
                <path d="M10,20 Q25,0 40,20 T70,20 T100,20 T130,20 T160,20 T190,20 T220,20 T250,20 T280,20 T310,20"/>
            </svg>
        </div>
    </div>

    <div class="steps-grid" id="grid"></div>

    <div class="footer-msg" id="statusMsg">Cada compra te acerca a tu premio 🌭</div>

    <a href="https://www.instagram.com/pankopato" target="_blank" class="instagram-link">
        <svg width="18" height="18" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0 3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
        @pankopato
    </a>

    <div class="legal-text">
        *Consumo mínimo de $90 pesos para validar cada sello.<br>
        *Descuentos no acumulables con otras promociones.<br><br>
        &copy; 2026 Panko. Todos los derechos reservados.
    </div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQo1281Gd3SB8Bua6Xm1TItk_iOgImoVkX1xhWzOc1fpxzIeo3ZMfNm4oThLgEcguFmnIwNVK3_Q-gv/pub?output=csv";

// Variable global para identificar si es cliente recurrente
let esClienteRecurrente = false;

async function loadCard() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
        document.body.innerHTML = "<div class='error'>❌ ID inválido</div>";
        return;
    }

    try {
        const response = await fetch(CSV_URL);
        let text = await response.text();
        
        text = text.replace(/^\uFEFF/, '');
        const rows = text.trim().split(/\r?\n/);

        let found = null;

        for (let i = 1; i < rows.length; i++) {
            const cols = rows[i].split(',').map(col => col.replace(/"/g, '').trim());

            const cliente = {
                id: cols[0],
                sellos: parseInt(cols[1]) || 0,
                nombre: cols[2],
                status: cols[3] ? cols[3].toUpperCase() : '' // Lee la cuarta columna (Columna D)
            };

            if (String(cliente.id).trim().toUpperCase() === String(id).trim().toUpperCase()) {
                found = cliente;
                break;
            }
        }

        if (!found) {
            document.body.innerHTML = `<div class='error'>❌ Cliente con ID "${id}" no encontrado</div>`;
            return;
        }

        // Si la cuarta columna tiene exactamente una "R", se activa la recurrencia
        if (found.status === 'R') {
            esClienteRecurrente = true;
        }

        document.getElementById('card').style.display = 'block';
        document.getElementById('userName').innerText = found.nombre;

        renderSteps(found.sellos);

    } catch (error) {
        console.error(error);
        document.body.innerHTML = "<div class='error'>❌ Error cargando tarjeta</div>";
    }
}

function renderSteps(count) {
    const grid = document.getElementById('grid');
    const sauce = document.getElementById('sauceLayer');

    grid.innerHTML = '';
    sauce.style.width = ((count / 9) * 100) + "%";

    for (let i = 1; i <= 9; i++) {
        const div = document.createElement('div');
        
        const esPremio = (i === 3 || i === 6 || i === 9);
        const yaGanado = i <= count;
        
        div.className = `step ${yaGanado ? 'active' : ''} ${(yaGanado && esPremio) ? 'is-premio' : ''}`;

        if (i === 3) {
            div.innerHTML = yaGanado ? "✨" : "Stickers"; 
        } else if (i === 6) {
            div.innerHTML = yaGanado ? "🎉 10%" : "10% OFF"; 
        } else if (i === 9) {
            div.innerHTML = yaGanado ? "🏆 20%" : "20% OFF"; 
        } else {
            div.innerHTML = i;
        }

        grid.appendChild(div);
    }

    // SISTEMA DE SEGMENTACIÓN INTELIGENTE BASADO EN LA COLUMNA STATUS
    if (count >= 9) {
        document.getElementById('statusMsg').innerHTML = "<strong>🎉 ¡TARJETA COMPLETA!<br>Ganaste un 20% de descuento en tu cuenta 🏆🔥</strong>";
    } else if (count >= 6) {
        document.getElementById('statusMsg').innerHTML = "<strong>¡Felicidades! Tienes un 10% de descuento 🎉<br>Próxima meta: ¡20% de descuento total!</strong>";
    } else if (count >= 3) {
        document.getElementById('statusMsg').innerHTML = "<strong>¡Felicidades! Ganaste 3 Stickers ✨<br>Próxima meta: ¡10% de descuento!</strong>";
    } else if (count === 0) {
        if (esClienteRecurrente) {
            // 🌟 AQUÍ QUEDA EL TEXTO EN AMARILLO CON LA VARIABLE DE LA MOSTAZA:
            document.getElementById('statusMsg').innerHTML = "<strong>🔥 ¡Bienvenido de vuelta!<br><span style='color: var(--sauce-color);'>Por iniciar tarjeta tienes 10% OFF en tu próxima visita</span> 🌭✨</strong>";
        } else {
            document.getElementById('statusMsg').innerHTML = "<strong>🌭 ¡Inicia tu camino Panko!<br>Cada compra te acerca a premios y descuentos increíbles ✨</strong>";
        }
    } else if (count > 0) {
        document.getElementById('statusMsg').innerText = `¡Llevas ${count} de 9 sellos acumulados!`;
    }
}
loadCard();
</script>

<script>
// Bloquear clic derecho
document.addEventListener('contextmenu', event => event.preventDefault());

// Bloquear herramientas de desarrollo
document.onkeydown = function(e) {
    if(e.keyCode == 123) return false; // F12
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
    if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ver código fuente
}
</script>
</body>
</html>
